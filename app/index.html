<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aceh–Indonesia Toolkit</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1d1f;--mute:#6b6f76;--line:#e2e3e6;--acc:#0b6b57;--acc-ink:#fff;--warn:#9a5b00;--bad:#a4262c;--ok:#1b6e3c;--chip:#eef0f2}
@media (prefers-color-scheme:dark){:root{--bg:#141516;--card:#1d1f21;--ink:#ececee;--mute:#9a9ea6;--line:#2e3135;--acc:#3dbb9d;--acc-ink:#06241d;--warn:#e0a43c;--bad:#ef7a80;--ok:#5cc489;--chip:#2a2d31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 2px} .sub{color:var(--mute);margin:0 0 16px;font-size:13px}
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--mute);font:inherit;border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:120px;resize:vertical;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
select,button,input[type=file]{font:inherit}
button.p{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
button.s{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mute{color:var(--mute);font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 9px;font-size:12px;white-space:nowrap}
.KEEP,.unique,.ace{color:var(--ok)} .REVIEW,.NEAR_DUP_REVIEW,.mixed,.OCR_ERROR{color:var(--warn)} .REMOVE,.NON_ACEH,.FRAGMENT,.DUPLICATE_ACEHX,.DUPLICATE_SELF,.ind{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px} th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;background:var(--card)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap} .stat{background:var(--chip);border-radius:8px;padding:6px 12px} .stat b{display:block;font-size:18px}
.note{font-size:13px;color:var(--mute);border-left:3px solid var(--warn);padding:2px 10px;margin:8px 0}
.err{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Aceh → Indonesia toolkit</h1>
<p class="sub">Screen, normalize, deduplicate and draft-translate Acehnese text. Every translation is a <b>machine draft</b>, not ground truth.</p>
<div id="status" class="mute"></div>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-t="t1">Translate text</button>
  <button class="tab" role="tab" aria-selected="false" data-t="t2">Process a source (PDF / TXT)</button>
</div>

<section id="t1">
  <div class="card">
    <textarea id="txt" placeholder="Paste Acehnese text (Latin script). One sentence per line, or running text."></textarea>
    <div class="row"><select class="prov"></select><button class="p" id="go1">Normalize &amp; translate</button><span id="msg1" class="mute"></span></div>
  </div>
  <div id="out1"></div>
</section>

<section id="t2" hidden>
  <div class="card">
    <input type="file" id="file" accept=".pdf,.txt,.md">
    <div class="row">
      <label class="mute">Layout <select id="layout"><option>auto</option><option>verse</option><option>prose</option></select></label>
      <label class="mute"><input type="checkbox" id="ocr" checked> OCR scanned pages</label>
      <button class="p" id="go2">Run pipeline</button><span id="msg2" class="mute"></span>
    </div>
    <div class="note">Screening labels rows, it never deletes them. Near-duplicates and low-confidence OCR go to the review sheet.</div>
  </div>
  <div id="out2"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=[], providers={};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));$('#t1').hidden=b.dataset.t!=='t1';$('#t2').hidden=b.dataset.t!=='t2'});
async function api(path,opt){const r=await fetch(path,opt);const j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j}
function provSelect(){document.querySelectorAll('.prov').forEach(s=>{s.innerHTML=Object.entries(providers).map(([k,v])=>`<option value="${k}">${k==='copy'?'copy source (baseline, no translation)':k+' · '+esc(v)}</option>`).join('')})}
(async()=>{const st=await api('/api/status');providers=st.providers;provSelect();
 const real=Object.keys(providers).filter(k=>k!=='copy');
 $('#status').innerHTML=`Translators: ${real.length?real.join(', '):'<span class="err">none configured</span> (set ANTHROPIC_API_KEY or GROQ_API_KEY, or pip install transformers torch sentencepiece for NLLB)'} · OCR: ${st.ocr?'yes':'no'} · AcehX duplicate check: ${esc(st.acehx)}`})();
function chip(c,t){return `<span class="chip ${c}">${esc(t??c)}</span>`}
$('#go1').onclick=async()=>{const b=$('#go1');b.disabled=true;$('#msg1').textContent='working…';
 try{const j=await api('/api/translate_text',{method:'POST',body:JSON.stringify({text:$('#txt').value,provider:$('#t1 .prov').value})});
  $('#out1').innerHTML=`<div class="card wrap"><table><tr><th>Acehnese (raw)</th><th>Normalized</th><th>Indonesian (draft)</th><th>Check</th></tr>${j.items.map(i=>`<tr><td>${esc(i.ace_raw)}</td><td>${esc(i.ace_normalized)}<div class="mute">${i.norm_rules.join(', ')}</div></td><td>${esc(i.ind)}<div class="mute">${esc(i.model)}</div></td><td>${chip(i.lang)} <span class="mute">${i.lang_score}</span>${i.confidence==='low'?chip('REVIEW','low confidence'):''}</td></tr>`).join('')}</table></div>`;
  $('#msg1').textContent=$('#t1 .prov').value==='copy'?'Baseline selected: text is copied, not translated. Configure a translator.':'';
 }catch(e){$('#msg1').innerHTML=`<span class="err">${esc(e.message)}</span>`}b.disabled=false};
$('#go2').onclick=async()=>{const f=$('#file').files[0];if(!f)return $('#msg2').textContent='choose a file first';const b=$('#go2');b.disabled=true;$('#msg2').textContent='extracting, screening, deduplicating… (scanned pages are slow)';
 try{const j=await api(`/api/process?layout=${$('#layout').value}&ocr=${$('#ocr').checked?1:0}`,{method:'POST',headers:{'X-Filename':f.name},body:f});rows=j.rows;render(j);$('#msg2').textContent=''}
 catch(e){$('#msg2').innerHTML=`<span class="err">${esc(e.message)}</span>`}b.disabled=false};
function render(j){const s=j.summary,sc=Object.entries(s.screening).map(([k,v])=>`<div class="stat"><b>${v}</b>${k}</div>`).join(''),dd=Object.entries(s.dedup).map(([k,v])=>`<div class="stat"><b>${v}</b>${k}</div>`).join('');
 $('#out2').innerHTML=`<div class="card"><div class="stats"><div class="stat"><b>${j.pages}</b>pages</div><div class="stat"><b>${j.ocr_pages}</b>OCR pages</div><div class="stat"><b>${s.sentences}</b>sentences</div><div class="stat"><b>${s.usable_for_translation}</b>ready to translate</div></div>
 <div class="stats" style="margin-top:8px">${sc}</div><div class="stats" style="margin-top:8px">${dd}</div>
 ${j.pages_needing_ocr?`<div class="note">${j.pages_needing_ocr} scanned page(s) were skipped: OCR is not available.</div>`:''}
 <div class="row"><select class="prov"></select><button class="p" id="tr">Translate ready rows</button><button class="s" id="dl1">Download Atlas JSON</button><button class="s" id="dl2">Download review sheet (CSV)</button><label class="mute"><input type="checkbox" id="drafts"> include machine drafts in JSON</label><span id="msg3" class="mute"></span></div></div>
 <div class="card wrap"><table><tr><th>Page</th><th>Sentence</th><th>Normalized</th><th>Status</th><th>Indonesian (draft)</th></tr>${rows.slice(0,3000).map(r=>`<tr><td>${r.page}</td><td>${esc(r.ace_raw)}</td><td>${esc(r.ace_normalized)}</td><td>${chip(r.screening)} ${chip(r.dedup)}<div class="mute">${esc(r.screen_reason)} ${esc(r.dedup_ref||'')}</div></td><td>${esc(r.ind_raw||'')}</td></tr>`).join('')}</table></div>${rows.length>3000?'<div class="mute">Showing first 3000 rows; downloads contain all.</div>':''}`;
 provSelect();
 $('#tr').onclick=async()=>{$('#tr').disabled=true;$('#msg3').textContent='translating…';try{const k=await api('/api/translate_rows',{method:'POST',body:JSON.stringify({rows,provider:$('#out2 .prov').value})});rows=k.rows;render(j);}catch(e){$('#msg3').innerHTML=`<span class="err">${esc(e.message)}</span>`;$('#tr').disabled=false}};
 const dl=async(path,name,type)=>{const r=await fetch(path,{method:'POST',body:JSON.stringify({rows,include_drafts:$('#drafts').checked})});if(!r.ok){$('#msg3').innerHTML=`<span class="err">${esc((await r.json()).error)}</span>`;return}const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=name;a.click()};
 $('#dl1').onclick=()=>dl('/api/export','atlas_master.json');$('#dl2').onclick=()=>dl('/api/review_csv','review_sheet.csv')}
</script>
</body>
</html>
